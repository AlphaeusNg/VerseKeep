name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Practice scoring
        run: node tools/test-practice-core.mjs
      - name: Site structure
        run: node tools/test-site.mjs
      - name: JavaScript syntax
        run: node --check docs/assets/js/*.js && node --check tools/*.mjs

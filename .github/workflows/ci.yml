name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install browser test dependencies
        run: npm ci
      - name: Workflow policy
        run: node tools/test-workflow.mjs
      - name: Core contracts
        run: node tools/test-practice-core.mjs
      - name: Data contracts
        run: node tools/test-data-core.mjs
      - name: Live Bible requests
        run: node tools/test-bible-live.mjs
      - name: Site structure
        run: node tools/test-site.mjs
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run test:browser
      - name: JavaScript syntax
        run: node --check docs/assets/js/*.js && node --check tools/*.mjs
